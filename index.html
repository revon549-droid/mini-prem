<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b0614">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Mini Prem">
<title>Mini Prem</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⚽</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    color-scheme: dark;
    --bg: #0b0614; --card: #1a1030; --card-2: #231640; --raise: #2c1d50;
    --line: rgba(255, 255, 255, .08); --line-2: rgba(255, 255, 255, .14);
    --text: #f6f2ff; --muted: #a497c6; --dim: #7a6d9c;
    --accent: #00ff87; --ink: #0b0614; --pink: #ff2882; --cyan: #04f5ff; --amber: #ffb547;
    --win: #00e57a; --draw: #8f86a8; --loss: #ff2882;
    --p0: #00ff87; --p1: #04f5ff; --p2: #ffb547;          /* one colour per player: Leo, Lukas, Tom */
    --r: 18px;
    --display: 'Barlow Condensed', 'Arial Narrow', system-ui, sans-serif;
    --body: 'Inter', system-ui, -apple-system, 'Segoe UI', sans-serif;
    --shadow: 0 10px 30px rgba(0, 0, 0, .35);
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0; min-height: 100vh; color: var(--text); font: 15px/1.45 var(--body); -webkit-tap-highlight-color: transparent;
    background: var(--bg) radial-gradient(1100px 560px at 0% -10%, rgba(255, 40, 130, .16), transparent 60%) no-repeat;
  }
  body::before {                                          /* second glow, fixed so it doesn't scroll away */
    content: ''; position: fixed; inset: 0; z-index: -1; pointer-events: none;
    background: radial-gradient(800px 480px at 105% 0%, rgba(4, 245, 255, .09), transparent 60%);
  }
  button { font: inherit; color: inherit; cursor: pointer; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .muted { color: var(--muted); }

  /* ---------- top bar ---------- */
  .topbar { position: sticky; top: 0; z-index: 5; padding-top: env(safe-area-inset-top);
    background: rgba(11, 6, 20, .72); -webkit-backdrop-filter: blur(14px); backdrop-filter: blur(14px); border-bottom: 1px solid var(--line); }
  .topbar-in { max-width: 1120px; margin: 0 auto; min-height: 58px; padding: 9px 16px; display: flex; align-items: center; gap: 12px; }
  .brand { display: flex; align-items: center; gap: 9px; font-family: var(--display); font-weight: 800; font-size: 23px;
    letter-spacing: .5px; text-transform: uppercase; }
  .brand b { color: var(--accent); }
  .logo { width: 32px; height: 32px; border-radius: 10px; display: grid; place-items: center; font-size: 17px;
    background: linear-gradient(135deg, var(--accent), var(--cyan)); }
  .spacer { flex: 1; }
  .status { display: inline-flex; align-items: center; gap: 7px; padding: 5px 11px; border: 1px solid var(--line-2);
    border-radius: 999px; font-size: 12px; font-weight: 600; color: var(--muted); white-space: nowrap; }
  .status i { width: 8px; height: 8px; border-radius: 50%; background: var(--amber); }
  .status.ok i { background: var(--win); animation: pulse 2s infinite; }
  .status.err i { background: var(--pink); }
  @keyframes pulse { 0% { box-shadow: 0 0 0 0 rgba(0, 229, 122, .55); } 70% { box-shadow: 0 0 0 8px rgba(0, 229, 122, 0); } 100% { box-shadow: 0 0 0 0 rgba(0, 229, 122, 0); } }

  /* ---------- buttons & inputs ---------- */
  .btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; padding: 11px 16px; border-radius: 12px;
    border: 1px solid var(--line-2); background: var(--raise); color: var(--text); font-weight: 600;
    transition: transform .08s, background-color .15s, border-color .15s, filter .15s; }
  .btn:hover { border-color: rgba(255, 255, 255, .3); }
  .btn:active { transform: scale(.98); }
  .btn.primary { background: var(--accent); color: var(--ink); border-color: transparent; font-weight: 800; box-shadow: 0 8px 28px rgba(0, 255, 135, .22); }
  .btn.primary:hover { filter: brightness(1.07); }
  .btn.ghost { background: transparent; }
  .btn.danger { background: transparent; color: #ff86b2; border-color: rgba(255, 40, 130, .35); }
  .btn.danger:hover { background: rgba(255, 40, 130, .12); }
  .btn.sm { padding: 7px 12px; font-size: 13px; border-radius: 10px; }
  .btn.xl { width: 100%; padding: 16px 20px; border-radius: 16px; font-family: var(--display); font-size: 25px; letter-spacing: .6px; text-transform: uppercase; }
  .btn:disabled { opacity: .35; cursor: not-allowed; transform: none; filter: none; box-shadow: none; }
  .icon-btn { width: 40px; height: 40px; flex: 0 0 auto; display: grid; place-items: center; padding: 0; border-radius: 12px;
    border: 1px solid var(--line-2); background: var(--raise); color: var(--text); }
  .icon-btn:hover { border-color: rgba(255, 255, 255, .3); }
  .icon-btn.sm { width: 32px; height: 32px; border-radius: 9px; color: var(--dim); background: transparent; }
  .icon-btn svg { width: 18px; height: 18px; }
  .icon-btn.sm svg { width: 15px; height: 15px; }
  input[type=text], input[type=password], input[type=number] { width: 100%; padding: 12px 14px; border-radius: 12px;
    border: 1px solid var(--line-2); background: rgba(0, 0, 0, .28); color: var(--text); font: inherit; -moz-appearance: textfield; }
  input::-webkit-inner-spin-button, input::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }
  input:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px rgba(0, 255, 135, .18); }
  input::placeholder { color: var(--dim); }

  /* ---------- player badges ---------- */
  .av { --c: var(--p0); width: 32px; height: 32px; flex: 0 0 auto; display: inline-grid; place-items: center; border-radius: 50%;
    background: var(--c); color: var(--ink); font-family: var(--display); font-weight: 800; font-size: 18px; line-height: 1; }
  .av.p1 { --c: var(--p1); } .av.p2 { --c: var(--p2); }
  .av.sm { width: 22px; height: 22px; font-size: 13px; }
  .av.xl { width: 58px; height: 58px; font-size: 32px; }

  /* ---------- page layout ---------- */
  main { max-width: 1120px; margin: 0 auto; padding: 22px 16px calc(28px + env(safe-area-inset-bottom)); }
  .page-head { margin: 0 0 20px; }
  .eyebrow { font-size: 12px; font-weight: 700; letter-spacing: 1.6px; text-transform: uppercase; color: var(--muted); }
  .title { margin: 4px 0 0; font-family: var(--display); font-weight: 800; font-size: clamp(36px, 8vw, 56px); line-height: .92;
    text-transform: uppercase; overflow-wrap: anywhere; }
  .sec { margin: 0 0 10px; font-size: 12px; font-weight: 700; letter-spacing: 1.6px; text-transform: uppercase; color: var(--muted); }
  .block { margin-bottom: 24px; }
  .card { background: linear-gradient(180deg, var(--card-2), var(--card)); border: 1px solid var(--line); border-radius: var(--r); overflow: hidden; }
  .empty { padding: 28px 18px; text-align: center; color: var(--muted); }
  .foot { display: flex; justify-content: center; margin-top: 12px; }

  /* ---------- dashboard ---------- */
  .league-grid { display: grid; gap: 14px; grid-template-columns: 1fr; }
  @media (min-width: 640px) { .league-grid { grid-template-columns: repeat(2, 1fr); } }
  @media (min-width: 980px) { .league-grid { grid-template-columns: repeat(3, 1fr); } }
  .league-grid .empty { grid-column: 1 / -1; border: 1px dashed var(--line-2); border-radius: var(--r); }
  .lg { position: relative; overflow: hidden; display: grid; gap: 14px; width: 100%; padding: 18px; text-align: left;
    border: 1px solid var(--line); border-radius: var(--r); background: linear-gradient(160deg, #2b1652, var(--card) 72%);
    transition: transform .12s, border-color .15s; }
  .lg::after { content: ''; position: absolute; top: -50px; right: -50px; width: 150px; height: 150px; border-radius: 50%;
    background: radial-gradient(circle, rgba(0, 255, 135, .18), transparent 70%); pointer-events: none; }
  .lg:hover { transform: translateY(-2px); border-color: rgba(0, 255, 135, .45); }
  .lg-top { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
  .lg-top b { font-family: var(--display); font-size: 28px; font-weight: 800; line-height: 1; text-transform: uppercase; overflow-wrap: anywhere; }
  .lg-top .go { color: var(--accent); font-size: 20px; }
  .lg-mini { display: grid; gap: 7px; }
  .mini { display: flex; align-items: center; gap: 9px; font-size: 14px; color: var(--muted); }
  .mini .n { flex: 1; }
  .mini b { font-family: var(--display); font-size: 19px; color: var(--text); }
  .mini b small { font-family: var(--body); font-size: 11px; color: var(--dim); margin-left: 3px; }
  .lg-foot { font-size: 12px; color: var(--dim); }
  .new-league { display: flex; gap: 10px; padding: 10px; margin-top: 14px; }
  .new-league input { flex: 1; min-width: 0; }

  /* ---------- league view ---------- */
  .league-layout { display: grid; gap: 0 24px; grid-template-columns: minmax(0, 1fr); }
  @media (min-width: 980px) { .league-layout { grid-template-columns: minmax(0, 1.25fr) minmax(0, 1fr); align-items: start; } }
  .hero { padding: 20px; display: grid; gap: 18px;
    background: radial-gradient(420px 200px at 100% 0%, rgba(0, 255, 135, .2), transparent 70%), linear-gradient(160deg, #2c1554, var(--card) 72%); }
  .hero-lead { display: flex; align-items: center; gap: 14px; }
  .hero-lead .big { font-family: var(--display); font-size: 32px; font-weight: 800; line-height: 1; text-transform: uppercase; }
  .hero-stats { display: flex; gap: 22px; font-size: 12px; color: var(--muted); }
  .hero-stats b { display: block; font-family: var(--display); font-size: 26px; line-height: 1.1; color: var(--text); }

  .tbl { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; }
  .tbl th { padding: 12px 5px; border-bottom: 1px solid var(--line); text-align: center; font-size: 11px; font-weight: 700;
    letter-spacing: 1px; text-transform: uppercase; color: var(--dim); }
  .tbl td { padding: 12px 5px; border-bottom: 1px solid var(--line); text-align: center; }
  .tbl tr:last-child td { border-bottom: 0; }
  .tbl .pos { width: 44px; padding-left: 14px; }
  .tbl .pos span { display: inline-grid; place-items: center; width: 26px; height: 26px; border-radius: 8px;
    background: rgba(255, 255, 255, .06); font-size: 13px; font-weight: 700; }
  .tbl tr.lead .pos span { background: var(--accent); color: var(--ink); }
  .tbl .team { text-align: left; }
  .tbl .pts { padding-right: 16px; font-family: var(--display); font-size: 24px; font-weight: 800; }
  .tbl th.pts { font-family: var(--body); font-size: 11px; }
  .tbl .wide { display: none; }
  @media (min-width: 480px) { .tbl .wide { display: table-cell; } }
  .who { display: flex; align-items: center; gap: 10px; min-width: 0; }
  .who b { display: block; font-weight: 700; }
  .form { display: flex; gap: 3px; margin-top: 4px; }
  .dot { width: 16px; height: 16px; border-radius: 5px; display: grid; place-items: center; font-size: 9px; font-weight: 800; color: var(--ink); }
  .dot.W { background: var(--win); } .dot.D { background: var(--draw); } .dot.L { background: var(--loss); color: #fff; }

  .sc { display: grid; grid-template-columns: auto 1fr auto; align-items: center; gap: 12px; padding: 12px 16px; border-bottom: 1px solid var(--line); }
  .sc:last-child { border-bottom: 0; }
  .sc .bar { height: 7px; margin-top: 6px; border-radius: 99px; overflow: hidden; background: rgba(255, 255, 255, .06); }
  .sc .bar i { display: block; height: 100%; border-radius: 99px; background: var(--c); transition: width .3s; }
  .sc .n { font-family: var(--display); font-size: 26px; font-weight: 800; }

  .mrow { display: grid; gap: 6px; padding: 12px 16px; border-bottom: 1px solid var(--line); cursor: pointer; }
  .mrow:last-child { border-bottom: 0; }
  .mrow:hover { background: rgba(255, 255, 255, .025); }
  .m-meta { display: flex; align-items: center; justify-content: space-between; font-size: 12px; color: var(--dim); }
  .m-line { display: grid; grid-template-columns: 56px 1fr auto; align-items: center; gap: 10px; color: var(--muted); }
  .m-line .avs { display: flex; }
  .m-line .avs .av + .av { margin-left: -9px; box-shadow: 0 0 0 2px var(--card); }
  .m-line .sc-n { min-width: 30px; text-align: right; font-family: var(--display); font-size: 28px; font-weight: 800; line-height: 1.1; }
  .m-line.win { color: var(--text); font-weight: 700; }
  .m-line.win .sc-n { color: var(--accent); }
  .hs { margin-left: 6px; padding: 1px 6px; border: 1px solid rgba(255, 181, 71, .45); border-radius: 6px;
    font-size: 11px; font-weight: 700; font-style: normal; color: var(--amber); }
  .m-more { font-size: 12px; color: var(--dim); }
  .mrow .tl { margin: 6px -16px -12px; border-top: 1px solid var(--line); background: rgba(0, 0, 0, .22); }

  details.settings summary { display: flex; align-items: center; justify-content: space-between; padding: 16px; list-style: none; cursor: pointer; font-weight: 700; }
  details.settings summary::-webkit-details-marker { display: none; }
  details.settings summary::after { content: '\25BE'; color: var(--muted); transition: transform .2s; }
  details.settings[open] summary::after { transform: rotate(180deg); }
  .settings-body { display: grid; gap: 16px; padding: 0 16px 16px; }
  .players { display: grid; gap: 12px; }
  .pl { display: grid; grid-template-columns: auto minmax(0, 1fr) 104px; align-items: end; gap: 10px; }
  .pl .av { margin-bottom: 8px; }
  .pl label { display: grid; gap: 4px; font-size: 11px; font-weight: 600; color: var(--muted); }
  .danger-row { display: flex; flex-wrap: wrap; gap: 10px; }

  /* ---------- goal timeline (OneFootball style) ---------- */
  .tl { padding: 8px 0; }
  .ev { display: grid; grid-template-columns: 1fr 66px 1fr; align-items: center; gap: 8px; padding: 8px 14px; font-size: 14px; }
  .evl { text-align: right; } .evr { text-align: left; }
  .evm { text-align: center; font-family: var(--display); font-size: 19px; font-weight: 800; line-height: 1; color: var(--accent); }
  .evm small { display: block; margin-top: 3px; font-family: var(--body); font-size: 11px; font-weight: 600; color: var(--muted); }
  .ev.ht { display: flex; align-items: center; gap: 10px; padding: 7px 14px; font-size: 11px; font-weight: 700;
    letter-spacing: 1.2px; text-transform: uppercase; color: var(--muted); }
  .ev.ht::before, .ev.ht::after { content: ''; flex: 1; height: 1px; background: var(--line-2); }
  .ev.ht span { white-space: nowrap; }
  .tl .empty { padding: 18px; }

  /* ---------- full-screen overlays ---------- */
  .overlay { position: fixed; inset: 0; z-index: 8; display: flex; flex-direction: column; overflow-y: auto;
    padding: env(safe-area-inset-top) 16px 0; background: var(--bg) radial-gradient(900px 480px at 50% -20%, rgba(255, 40, 130, .15), transparent 60%) no-repeat; }
  .ov-in { flex: 1; width: 100%; max-width: 560px; margin: 0 auto; padding-top: 12px; display: flex; flex-direction: column; gap: 14px; }
  .ov-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; min-height: 44px; }
  .ov-head h2 { margin: 0; font-family: var(--display); font-size: 30px; font-weight: 800; text-transform: uppercase; }
  .ov-actions { position: sticky; bottom: 0; margin-top: auto; display: grid; gap: 10px;
    padding: 18px 0 calc(16px + env(safe-area-inset-bottom)); background: linear-gradient(180deg, transparent, var(--bg) 32%); }
  #lineup { z-index: 8; } #matchView { z-index: 9; } #gate { z-index: 12; }

  /* gate */
  #gate .ov-in { justify-content: center; max-width: 400px; padding-bottom: 40px; }
  .gate-card { display: grid; gap: 14px; padding: 28px 22px; text-align: center; }
  .gate-logo { width: 74px; height: 74px; margin: 0 auto 4px; display: grid; place-items: center; border-radius: 22px; font-size: 40px;
    background: linear-gradient(135deg, var(--accent), var(--cyan)); box-shadow: 0 14px 44px rgba(0, 255, 135, .28); }
  .gate-title { margin: 0; font-family: var(--display); font-size: 48px; font-weight: 800; line-height: .9; text-transform: uppercase; }
  .gate-title b { color: var(--accent); }
  .gate-card p { margin: 0; }
  #gateErr { min-height: 1.3em; font-size: 13px; color: #ff86b2; }

  /* line-up */
  .hint { margin: 0; color: var(--muted); }
  .zone h3 { margin: 0 0 10px; font-size: 11px; font-weight: 700; letter-spacing: 1.4px; text-transform: uppercase; color: var(--muted); }
  .zone.over { box-shadow: inset 0 0 0 3px var(--accent); }
  .bench { padding: 12px; border: 1px dashed var(--line-2); border-radius: var(--r); background: rgba(255, 255, 255, .03); }
  .pitch { position: relative; display: grid; grid-template-columns: 1fr 1fr; min-height: 250px; overflow: hidden;
    border: 2px solid rgba(255, 255, 255, .6); border-radius: var(--r);
    background: repeating-linear-gradient(90deg, #12683d 0 36px, #0f5b35 36px 72px); }
  .pitch::before { content: ''; position: absolute; top: 0; bottom: 0; left: 50%; width: 2px; transform: translateX(-1px); background: rgba(255, 255, 255, .6); }
  .pitch::after { content: ''; position: absolute; top: 50%; left: 50%; width: 78px; height: 78px; transform: translate(-50%, -50%);
    border: 2px solid rgba(255, 255, 255, .6); border-radius: 50%; }
  .half { position: relative; z-index: 1; display: flex; flex-direction: column; padding: 12px 10px; }
  .half h3 { text-align: center; color: rgba(255, 255, 255, .9); text-shadow: 0 1px 2px rgba(0, 0, 0, .4); }
  .half .chips { flex: 1; flex-direction: column; align-items: center; justify-content: center; }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; min-height: 50px; }
  .chip { display: inline-flex; align-items: center; gap: 8px; padding: 5px 14px 5px 5px; border: 1px solid var(--line-2); border-radius: 999px;
    background: var(--raise); font-size: 16px; font-weight: 700; cursor: grab; touch-action: none; user-select: none; -webkit-user-select: none;
    box-shadow: var(--shadow); }
  .chip .av { width: 34px; height: 34px; }
  .chip.dragging { opacity: .3; }
  .chip.ghost { position: fixed; z-index: 30; pointer-events: none; transform: translate(-50%, -50%) scale(1.06); }
  .vs-line { min-height: 1.4em; text-align: center; font-weight: 600; color: var(--muted); }
  .durations { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .durations label { display: grid; gap: 4px; font-size: 12px; font-weight: 600; color: var(--muted); }

  /* live match */
  #matchView .ov-in { max-width: 1040px; }
  .phase-pill { display: inline-flex; align-items: center; gap: 8px; padding: 6px 12px; border: 1px solid var(--line-2); border-radius: 999px;
    background: rgba(255, 255, 255, .06); font-size: 12px; font-weight: 700; letter-spacing: 1.2px; text-transform: uppercase; }
  .phase-pill::before { content: ''; width: 8px; height: 8px; border-radius: 50%; background: var(--muted); }
  .phase-pill.live::before { background: var(--pink); animation: blink 1.2s infinite; }
  @keyframes blink { 50% { opacity: .25; } }
  .mv-grid { display: grid; gap: 14px; }
  .mv-main { display: grid; gap: 14px; }
  @media (min-width: 900px) { .mv-grid { grid-template-columns: minmax(0, 1.3fr) minmax(0, 1fr); align-items: start; } }
  .scoreboard { display: grid; grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr); align-items: center; gap: 6px 10px; padding: 16px 14px 18px; text-align: center;
    background: radial-gradient(420px 170px at 50% 0%, rgba(0, 255, 135, .12), transparent 70%), linear-gradient(180deg, var(--card-2), var(--card)); }
  .sb-clock { grid-column: 1 / -1; font-family: var(--display); font-size: clamp(76px, 25vw, 136px); font-weight: 800; line-height: .9;
    letter-spacing: 1px; font-variant-numeric: tabular-nums; }
  .sb-clock.done { color: var(--pink); }
  .sb-team .nm { font-size: clamp(15px, 4.2vw, 20px); font-weight: 800; overflow-wrap: anywhere; }
  .sb-team .kind { margin-top: 2px; font-size: 11px; color: var(--muted); }
  .sb-team::after { content: ''; display: block; width: 30px; height: 3px; margin: 7px auto 0; border-radius: 2px; background: var(--accent); }
  .sb-team.b::after { background: var(--pink); }
  .sb-score { display: flex; align-items: center; gap: 6px; font-family: var(--display); font-size: clamp(60px, 19vw, 100px); font-weight: 800;
    line-height: 1; font-variant-numeric: tabular-nums; }
  .sb-score .sep { font-size: .55em; color: var(--dim); }
  .pads { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .pad { display: grid; gap: 8px; }
  .goal-btn { padding: 22px 8px; border: 0; border-radius: 18px; font-family: var(--display); font-size: 30px; font-weight: 800; text-transform: uppercase;
    background: var(--accent); color: var(--ink); box-shadow: 0 10px 30px rgba(0, 255, 135, .22); transition: transform .08s; }
  .pad.b .goal-btn { background: var(--pink); color: #fff; box-shadow: 0 10px 30px rgba(255, 40, 130, .28); }
  .goal-btn:active { transform: scale(.97); }
  .undo { padding: 10px; border: 1px solid var(--line-2); border-radius: 12px; background: transparent; color: var(--muted); font-weight: 600; }
  #mTimeline { max-height: 32vh; overflow-y: auto; }
  @media (min-width: 900px) { #mTimeline { max-height: 62vh; } }

  /* who-scored sheet */
  #scorer { position: fixed; inset: 0; z-index: 11; display: flex; align-items: flex-end; justify-content: center; padding: 16px;
    background: rgba(5, 2, 10, .72); -webkit-backdrop-filter: blur(4px); backdrop-filter: blur(4px); }

  .sheet-card { width: min(440px, 100%); display: grid; gap: 14px; padding: 22px 20px calc(18px + env(safe-area-inset-bottom)); animation: rise .18s ease-out; }
  @keyframes rise { from { transform: translateY(24px); opacity: 0; } }
  .sheet-card h2 { margin: 0; text-align: center; font-family: var(--display); font-size: 30px; font-weight: 800; text-transform: uppercase; }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation: none !important; transition: none !important; }
  }
</style>
</head>

<script type="module">
import { initializeApp } from 'https://www.gstatic.com/firebasejs/11.0.2/firebase-app.js';
import { initializeFirestore, collection, doc, onSnapshot, setDoc, updateDoc, deleteDoc, arrayUnion, arrayRemove }
  from 'https://www.gstatic.com/firebasejs/11.0.2/firebase-firestore.js';

// Web API keys are public identifiers; access is controlled by Firestore rules.
const app = initializeApp({
  apiKey: "AIzaSyDDQJ4m4X1LUUWve87MjJ1phbHbbsh2hyQ",
  authDomain: "mini-prem.firebaseapp.com",
  projectId: "mini-prem",
  storageBucket: "mini-prem.firebasestorage.app",
  messagingSenderId: "361716883278",
  appId: "1:361716883278:web:1429d43c2f2318efc3081f",
});
const db = initializeFirestore(app, { experimentalAutoDetectLongPolling: true });
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
// Round badge with the player's initial, coloured per player (index 0-2).
const av = (pl, i, cls = '') => `<span class="av p${i} ${cls}">${esc((pl[i] || '?').trim().charAt(0).toUpperCase())}</span>`;
const TRASH = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18M8 6V4h8v2M6 6l1 14h10l1-14"/></svg>';

// Data lives at groups/<sha256(code)>/leagues/<id>. Only someone who knows the code can find the group;
// the Firestore rules allow access below a group path but never list the groups themselves.
let leaguesCol = null, leagueRef = null, unsub = null;
let leagues = {};            // id -> { name, players, handicap, matches, createdAt }
let currentId = null;        // open league, or null for the dashboard
let state = null;            // the open league
const CODE_KEY = 'mini-prem-code';
const sha256 = async s => [...new Uint8Array(await crypto.subtle.digest('SHA-256', new TextEncoder().encode(s)))]
  .map(b => b.toString(16).padStart(2, '0')).join('');
// Connection pill in the top bar: kind is 'ok' (green), 'warn' (amber) or 'err' (pink).
const setStatus = (text, kind = 'warn') => { $('status').className = 'status ' + kind; $('status').lastElementChild.textContent = text; };
const remote = p => p.catch(err => { console.error(err); setStatus('Not saved: ' + (err.code || 'offline'), 'err'); });

// ---- Model ----
// Three players, one table row each. A match is always two of them against the third, so there are only
// three possible match-ups. Match k = player k plays alone against the other two (the pair).
// A stored match: { id, t, k, dg (pair goals), sg (solo goals), hs, goals: [{ s: 'd'|'s', p: scorer index, m, h, x }] }
const DEFAULT_PLAYERS = ['Leo', 'Lukas', 'Tom'];
// Handicap: a player who plays alone against the other two starts with this many goals (per player, editable).
// Leo alone 0-5, Lukas alone 0-0, Tom alone 0-3 (pair first, solo second).
const DEFAULT_HANDICAP = [5, 0, 3];
const pairOf = k => [0, 1, 2].filter(x => x !== k);
const pairName = (pl, k) => pairOf(k).map(x => pl[x]).join(' & ');

// The table has one row per player. In a match every member of the winning side gets the points
// separately (3 for a win, 1 for a draw), and each player is credited with his side's goals.
function standings(l) {
  const rows = [0, 1, 2].map(i => ({ i, name: l.players[i], p: 0, w: 0, d: 0, l: 0, gf: 0, ga: 0, form: [] }));
  const add = (r, gf, ga) => {
    r.p++; r.gf += gf; r.ga += ga;
    if (gf > ga) { r.w++; r.form.push('W'); } else if (gf < ga) { r.l++; r.form.push('L'); } else { r.d++; r.form.push('D'); }
  };
  for (const m of [...l.matches].sort((a, b) => a.t - b.t)) {
    add(rows[m.k], m.sg, m.dg);
    pairOf(m.k).forEach(i => add(rows[i], m.dg, m.sg));
  }
  rows.forEach(r => { r.gd = r.gf - r.ga; r.pts = r.w * 3 + r.d; });
  return rows.sort((x, y) => y.pts - x.pts || y.gd - x.gd || y.gf - x.gf || x.name.localeCompare(y.name));
}

// ---- League view ----
function renderHero() {
  const rows = standings(state), n = state.matches.length, top = rows[0];
  const goals = state.matches.reduce((s, m) => s + m.goals.length, 0);
  $('hero').innerHTML = n
    ? `<div class="hero-lead">${av(state.players, top.i, 'xl')}<div><div class="eyebrow">Leader</div><div class="big">${esc(top.name)}</div></div></div>
       <div class="hero-stats"><span><b>${top.pts}</b>points</span><span><b>${n}</b>match${n === 1 ? '' : 'es'}</span><span><b>${goals}</b>goals</span></div>`
    : `<div><div class="eyebrow">New season</div><div class="hero-lead"><div class="big">No matches yet</div></div></div>
       <p class="muted" style="margin:0">Put the three of you on the pitch and kick off.</p>`;
}

function renderTable() {
  const rows = standings(state);
  $('table').innerHTML =
    `<thead><tr><th class="pos">#</th><th class="team">Player</th><th>P</th><th>W</th><th>D</th><th>L</th>
     <th class="wide">Goals</th><th>GD</th><th class="pts">Pts</th></tr></thead><tbody>` +
    rows.map((r, k) => `<tr class="${k === 0 && r.p ? 'lead' : ''}">
      <td class="pos"><span>${k + 1}</span></td>
      <td class="team"><div class="who">${av(state.players, r.i)}<div><b>${esc(r.name)}</b>
        <div class="form">${r.form.slice(-5).map(f => `<span class="dot ${f}">${f}</span>`).join('')}</div></div></div></td>
      <td>${r.p}</td><td>${r.w}</td><td>${r.d}</td><td>${r.l}</td>
      <td class="wide">${r.gf}:${r.ga}</td>
      <td>${r.gd > 0 ? '+' : ''}${r.gd}</td><td class="pts">${r.pts}</td>
    </tr>`).join('') + '</tbody>';
}

function renderScorers() {
  const n = [0, 0, 0];
  state.matches.forEach(m => m.goals.forEach(g => { if (g.p >= 0 && g.p < 3) n[g.p]++; }));
  const max = Math.max(1, ...n);
  $('scorers').innerHTML = [0, 1, 2].sort((a, b) => n[b] - n[a]).map(i =>
    `<div class="sc">${av(state.players, i)}<div><b>${esc(state.players[i])}</b>
      <div class="bar"><i style="width:${n[i] / max * 100}%;--c:var(--p${i})"></i></div></div><span class="n">${n[i]}</span></div>`).join('');
}

// Goal timeline. goals: [{ side: 'L'|'R', p (scorer), m (minute), h (half), x (extra-time minute) }], listed in time
// order with the running score, a head-start row, an HT row before the 2nd half, an extra-time row and an optional FT row.
function timeline(goals, showHT, ftLabel, showET, head = [0, 0]) {
  const gs = [...goals].sort((a, b) => (a.h || 1) - (b.h || 1) || (a.m || 0) - (b.m || 0) || (a.x || 0) - (b.x || 0));
  let l = head[0], r = head[1], html = '', ht = false, et = false;
  if (l || r) html += `<div class="ev ht"><span>Head start ${l} &ndash; ${r}</span></div>`;
  const htRow = () => `<div class="ev ht"><span>HT ${l} &ndash; ${r}</span></div>`;
  const etRow = () => `<div class="ev ht"><span>Extra time ${l} &ndash; ${r}</span></div>`;
  for (const g of gs) {
    if (g.h >= 2 && !ht) { html += htRow(); ht = true; }
    if (g.h === 3 && !et) { html += etRow(); et = true; }
    if (g.side === 'L') l++; else r++;
    const name = esc(state.players[g.p] || '?');
    html += `<div class="ev"><span class="evl">${g.side === 'L' ? name + ' &#9917;' : ''}</span>
      <span class="evm">${g.x ? g.m + '+' + g.x + "'" : g.m ? g.m + "'" : '&nbsp;'}<small>${l}&ndash;${r}</small></span>
      <span class="evr">${g.side === 'R' ? '&#9917; ' + name : ''}</span></div>`;
  }
  if (showHT && !ht) html += htRow();
  if (showET && !et) html += etRow();                    // extra time has started but nothing happened yet
  if (ftLabel) html += `<div class="ev ht"><span>${ftLabel} ${l} &ndash; ${r}</span></div>`;
  return html || '<div class="empty">No goals yet</div>';
}

const openMatches = new Set();
function renderMatches() {
  const pl = state.players;
  $('matches').innerHTML = state.matches.length ? [...state.matches].sort((a, b) => b.t - a.t).map(m => {
    const when = new Date(m.t).toLocaleString('de-DE', { weekday: 'short', day: '2-digit', month: '2-digit', hour: '2-digit', minute: '2-digit' });
    const open = openMatches.has(m.id), res = m.dg > m.sg ? 'd' : m.dg < m.sg ? 's' : '';
    return `<div class="mrow" data-id="${esc(m.id)}">
      <div class="m-meta"><span>${when}</span><button class="icon-btn sm" data-del="${esc(m.id)}" aria-label="Delete match">${TRASH}</button></div>
      <div class="m-line ${res === 'd' ? 'win' : ''}"><span class="avs">${pairOf(m.k).map(i => av(pl, i)).join('')}</span>
        <span>${esc(pairName(pl, m.k))}</span><span class="sc-n">${m.dg}</span></div>
      <div class="m-line ${res === 's' ? 'win' : ''}"><span class="avs">${av(pl, m.k)}</span>
        <span>${esc(pl[m.k])}${m.hs ? `<em class="hs">+${m.hs} start</em>` : ''}</span><span class="sc-n">${m.sg}</span></div>
      <div class="m-more">${open ? 'Hide goals &#9652;' : 'Show goals &#9662;'}</div>
      ${open ? `<div class="tl">${timeline(m.goals.map(g => ({ side: g.s === 'd' ? 'L' : 'R', p: g.p, m: g.m, h: g.h, x: g.x })), true, 'FT', false, [0, m.hs || 0])}</div>` : ''}
    </div>`;
  }).join('') : '<div class="empty">No matches yet. Hit "Start match".</div>';
}
$('matches').addEventListener('click', e => {
  const del = e.target.closest('[data-del]')?.dataset.del;
  if (!del) {                                            // tap on a match: show / hide its goal timeline
    const id = e.target.closest('.mrow')?.dataset.id; if (!id) return;
    openMatches.has(id) ? openMatches.delete(id) : openMatches.add(id); renderMatches(); return;
  }
  const m = state.matches.find(x => x.id === del);
  if (!m || !confirm('Delete this match from the table?')) return;
  state.matches = state.matches.filter(x => x.id !== del);
  renderAll();
  remote(updateDoc(leagueRef, { matches: arrayRemove(m) }));
});

function renderPlayers() {
  $('players').innerHTML = state.players.map((p, i) =>
    `<div class="pl">${av(state.players, i)}
      <label>Name <input type="text" data-i="${i}" value="${esc(p)}" maxlength="16"></label>
      <label>Head start alone <input type="number" data-h="${i}" min="0" max="20" value="${state.handicap[i]}" inputmode="numeric"></label></div>`).join('');
}
$('players').addEventListener('change', e => {
  const { i, h } = e.target.dataset;
  if (h !== undefined) {                                   // head start when this player plays alone
    state.handicap[h] = Math.min(20, Math.max(0, +e.target.value | 0));
    renderAll();
    remote(updateDoc(leagueRef, { handicap: state.handicap }));
    return;
  }
  if (i === undefined) return;
  state.players[i] = e.target.value.trim() || state.players[i];
  renderAll();
  remote(updateDoc(leagueRef, { players: state.players }));
});

function renderAll() { renderHero(); renderTable(); renderScorers(); renderMatches(); renderPlayers(); }

$('reset').onclick = () => {
  if (confirm('Delete ALL matches of this league for everyone? Players are kept.')) {
    state.matches = []; renderAll();
    remote(updateDoc(leagueRef, { matches: [] }));
  }
};

// ---- Dashboard / navigation ----
function renderDash() {
  const ids = Object.keys(leagues).sort((a, b) => (leagues[b].createdAt || 0) - (leagues[a].createdAt || 0));
  $('leagueList').innerHTML = ids.length ? ids.map(id => {
    const l = leagues[id], n = l.matches.length;
    return `<button class="lg" data-id="${esc(id)}">
      <div class="lg-top"><b>${esc(l.name)}</b><span class="go">&rarr;</span></div>
      <div class="lg-mini">${standings(l).map(r =>
        `<div class="mini">${av(l.players, r.i, 'sm')}<span class="n">${esc(r.name)}</span><b>${r.pts}<small>pts</small></b></div>`).join('')}</div>
      <div class="lg-foot">${n} match${n === 1 ? '' : 'es'} played</div>
    </button>`;
  }).join('') : '<div class="empty">No leagues yet. Create one below. If you expected some, check your code with "Change code".</div>';
}

function show() {
  const l = leagues[currentId];
  if (currentId && !l) currentId = null;
  $('dash').hidden = !!currentId;
  $('league').hidden = !currentId;
  $('back').hidden = !currentId;
  document.title = currentId ? `${l.name} · Mini Prem` : 'Mini Prem';
  if (currentId) {
    leagueRef = doc(leaguesCol, currentId);
    state = l; $('leagueName').textContent = l.name; renderAll();
    if (!match) {                      // pick up a match that was running before a reload
      try {
        const s = JSON.parse(localStorage.getItem('mini-prem-match-' + currentId));
        if (s && Array.isArray(s.A) && Array.isArray(s.B) && s.A.length + s.B.length === 3) { match = s; openMatch(); }
      } catch {}
    }
  } else { leagueRef = null; renderDash(); }
}
function openLeague(id) { currentId = id; history.replaceState(null, '', id ? '#' + id : location.pathname); show(); window.scrollTo(0, 0); }

$('leagueList').addEventListener('click', e => { const b = e.target.closest('.lg'); if (b) openLeague(b.dataset.id); });
$('back').onclick = () => openLeague(null);
$('delLeague').onclick = () => {
  const id = currentId;
  if (!id || !confirm(`Delete "${leagues[id].name}" for everyone? This cannot be undone.`)) return;
  const ref = doc(leaguesCol, id);
  delete leagues[id];
  openLeague(null);
  remote(deleteDoc(ref));
};
$('newLeague').addEventListener('submit', e => {
  e.preventDefault();
  const name = $('newName').value.trim();
  if (!name || !leaguesCol) return;
  const ref = doc(leaguesCol);
  const l = { name, players: [...DEFAULT_PLAYERS], handicap: [...DEFAULT_HANDICAP], matches: [], createdAt: Date.now() };
  leagues[ref.id] = l; $('newName').value = '';
  remote(setDoc(ref, l));
  openLeague(ref.id);
});

// ---- Line-up: drag the three players into two sides (2 vs 1, never 3 vs 0) ----
let lu = { pool: [0, 1, 2], A: [], B: [] };
const ZONES = ['pool', 'A', 'B'];
const zoneOf = p => ZONES.find(z => lu[z].includes(p));
function placeChip(p, zone) {
  if (zone !== 'pool' && lu[zone].length >= 2 && !lu[zone].includes(p)) return false;   // a side holds two at most
  ZONES.forEach(z => { lu[z] = lu[z].filter(x => x !== p); });
  lu[zone].push(p); return true;
}
function renderLineup() {
  const pl = state.players, chip = p => `<div class="chip" data-p="${p}">${av(pl, p)}<span>${esc(pl[p])}</span></div>`;
  $('cPool').innerHTML = lu.pool.map(chip).join(''); $('cA').innerHTML = lu.A.map(chip).join(''); $('cB').innerHTML = lu.B.map(chip).join('');
  const ok = lu.A.length + lu.B.length === 3;
  $('lGo').disabled = !ok;
  const side = z => lu[z].map(p => pl[p]).join(' & ');
  const solo = lu.A.length === 1 ? lu.A[0] : lu.B[0], hs = ok ? state.handicap[solo] : 0;
  $('lVs').textContent = ok ? `${side('A')}  vs  ${side('B')}` + (hs ? `  ·  ${pl[solo]} starts ${hs} up` : '') : 'Place all three players.';
}
$('lineup').addEventListener('pointerdown', e => {
  const c = e.target.closest('.chip'); if (!c) return;
  e.preventDefault();
  const p = +c.dataset.p, sx = e.clientX, sy = e.clientY;
  const ghost = c.cloneNode(true); ghost.classList.add('ghost'); document.body.appendChild(ghost);
  let moved = false;
  const place = ev => { ghost.style.left = ev.clientX + 'px'; ghost.style.top = ev.clientY + 'px'; };
  place(e);
  const zoneAt = ev => document.elementFromPoint(ev.clientX, ev.clientY)?.closest('[data-zone]')?.dataset.zone;
  const move = ev => {
    if (Math.abs(ev.clientX - sx) + Math.abs(ev.clientY - sy) > 8) { moved = true; c.classList.add('dragging'); }
    place(ev);
    document.querySelectorAll('.zone').forEach(z => z.classList.toggle('over', moved && z.dataset.zone === zoneAt(ev)));
  };
  const up = ev => {
    window.removeEventListener('pointermove', move); window.removeEventListener('pointercancel', up);
    ghost.remove(); document.querySelectorAll('.zone').forEach(z => z.classList.remove('over'));
    if (moved) { const z = zoneAt(ev); if (z) placeChip(p, z); }
    else {                                               // tap: send to the next zone that has room
      const from = ZONES.indexOf(zoneOf(p));
      for (let s = 1; s <= 3; s++) if (placeChip(p, ZONES[(from + s) % 3])) break;
    }
    renderLineup();
  };
  window.addEventListener('pointermove', move); window.addEventListener('pointerup', up, { once: true }); window.addEventListener('pointercancel', up, { once: true });
});
$('startMatch').onclick = () => {
  lu = { pool: [0, 1, 2], A: [], B: [] };
  try { $('mins').value = localStorage.getItem('mini-prem-mins') || $('mins').value; $('brkMins').value = localStorage.getItem('mini-prem-brk') || $('brkMins').value; } catch {}
  $('lineup').hidden = false; $('lineup').scrollTop = 0; renderLineup();
};
$('lCancel').onclick = () => { $('lineup').hidden = true; };

// ---- Live match: score taps, who-scored question for the pair, half timers ----
// phases: ready -> h1 -> ht (half time) -> [brk (optional break timer) -> ht] -> h2 -> et (extra time, automatic) -> ft (full time).
// After the 1st half you can start the 2nd half right away or start the break timer first.
// The clock runs off timestamps, and the match is kept in localStorage, so a locked phone or reload doesn't lose it.
let match = null, tickId = null, audioCtx = null, wake = null;
const PHASE = { ready: 'Ready', h1: '1st half', ht: 'Half time', brk: 'Break', h2: '2nd half', et: 'Extra time', ft: 'Full time' };
const EXTRA_MS = 60000;      // extra time after the 2nd half: starts by itself and lasts one minute
const saveMatch = () => { try { localStorage.setItem('mini-prem-match-' + match.lid, JSON.stringify(match)); } catch {} };
const goalsOf = s => match.goals.filter(g => g.s === s).length;                       // goals actually scored
const headStart = s => match[s].length === 1 ? match.hs || 0 : 0;                     // the solo side starts ahead
const scoreOf = s => goalsOf(s) + headStart(s);
const sideName = s => match[s].map(p => state.players[p]).join(' & ');

// The alarm is alarm.mp3 (about 30 s); it stops when someone taps the main button. Phones only allow
// sound after a tap, so the first tap "unlocks" it. If the file can't play, a synthesized beep is used.
const alarmAudio = new Audio('alarm.mp3'); alarmAudio.preload = 'auto';
let audioUnlocked = false;
function unlockAudio() {
  try { audioCtx ||= new (window.AudioContext || window.webkitAudioContext)(); audioCtx.resume(); } catch {}
  if (!audioUnlocked) {
    audioUnlocked = true;
    alarmAudio.muted = true;
    alarmAudio.play().then(() => { alarmAudio.pause(); alarmAudio.currentTime = 0; alarmAudio.muted = false; })
      .catch(() => { audioUnlocked = false; alarmAudio.muted = false; });
  }
}
function stopAlarm() { try { alarmAudio.pause(); alarmAudio.currentTime = 0; } catch {} try { navigator.vibrate?.(0); } catch {} }
function alarm() {
  try { navigator.vibrate?.([400, 200, 400, 200, 800]); } catch {}
  alarmAudio.currentTime = 0;
  alarmAudio.play().catch(beep);
}
function signal() {                                       // short double beep + buzz: extra time has started
  try { navigator.vibrate?.([200, 100, 200]); } catch {}
  beep(2);
}
function beep(n = 6) {
  const c = audioCtx; if (!c) return;
  c.resume?.();
  for (let i = 0; i < n; i++) {
    const o = c.createOscillator(), g = c.createGain(), t = c.currentTime + i * 0.45;
    o.type = 'square'; o.frequency.value = i % 2 ? 880 : 660; g.gain.value = 0.25;
    o.connect(g); g.connect(c.destination); o.start(t); o.stop(t + 0.35);
  }
}
async function wakeOn() { try { wake = await navigator.wakeLock?.request('screen'); } catch {} }
function wakeOff() { try { wake?.release(); } catch {} wake = null; }
document.addEventListener('visibilitychange', () => { if (match && document.visibilityState === 'visible') { wakeOn(); tick(); } });

function renderMatch() {
  const m = match, left = m.running ? Math.max(0, m.endAt - Date.now()) : m.remMs, s = Math.ceil(left / 1000);
  $('mHome').textContent = sideName('A'); $('mAway').textContent = sideName('B');
  const kind = s => match[s].length === 2 ? 'Pair' : 'Solo' + (match.hs ? ` · starts ${match.hs} up` : '');
  $('mHKind').textContent = kind('A'); $('mAKind').textContent = kind('B');
  $('mHS').textContent = scoreOf('A'); $('mAS').textContent = scoreOf('B');
  $('mPhase').textContent = PHASE[m.phase] + (!m.running && ['h1', 'h2', 'et'].includes(m.phase) ? ' · paused' : '');
  $('mPhase').classList.toggle('live', !!m.running);
  $('mClock').textContent = Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0');
  $('mClock').classList.toggle('done', m.phase === 'ht' || m.phase === 'ft');
  $('mMain').textContent = { ready: 'Kick off', ht: 'Start 2nd half', brk: 'Skip break · 2nd half', ft: 'Finish & update table' }[m.phase] || (m.running ? 'Pause' : 'Resume');
  $('mBreak').hidden = !(m.phase === 'ht' && !m.breakDone);
  const tk = JSON.stringify(m.goals) + m.phase;          // only rebuild the timeline when something changed
  if (tk !== renderMatch.last) {
    renderMatch.last = tk;
    $('mTimeline').innerHTML = timeline(m.goals.map(g => ({ side: g.s === 'A' ? 'L' : 'R', p: g.p, m: g.m, h: g.h, x: g.x })),
      ['ht', 'brk', 'h2', 'et', 'ft'].includes(m.phase), m.phase === 'ft' ? 'FT' : '', ['et', 'ft'].includes(m.phase),
      [headStart('A'), headStart('B')]);
    $('mTimeline').scrollTop = $('mTimeline').scrollHeight;
  }
}
// Minute and half of "now" in the match (2nd half continues counting after the 1st).
function nowMinute() {
  const m = match, left = m.running ? Math.max(0, m.endAt - Date.now()) : m.remMs;
  if (m.phase === 'et' || m.phase === 'ft') {              // extra time shows as e.g. 14+1'
    const el = m.phase === 'ft' ? EXTRA_MS : EXTRA_MS - left;
    return { h: 3, m: 2 * m.mins, x: Math.max(1, Math.ceil(el / 60000)) };
  }
  const h = m.phase === 'h2' ? 2 : 1;
  const elapsed = m.phase === 'ready' ? 0 : m.phase === 'brk' ? m.mins * 60000 : m.mins * 60000 - left;
  return { h, m: (h === 2 ? m.mins : 0) + Math.max(1, Math.ceil(elapsed / 60000)) };
}
function tick() {
  if (!match || !match.running) return;
  if (match.endAt - Date.now() <= 0) {
    if (match.phase === 'h2') {                          // extra time follows by itself, with a short signal
      match.phase = 'et'; match.endAt += EXTRA_MS; match.remMs = EXTRA_MS; saveMatch(); signal();
    }
    if (match.endAt - Date.now() <= 0) {
      match.running = false; match.remMs = 0;
      if (match.phase === 'brk') match.breakDone = true;
      match.phase = match.phase === 'et' ? 'ft' : 'ht';  // h1 and brk both end at half time
      saveMatch(); alarm();
    }
  }
  renderMatch();
}
function openMatch() {
  $('lineup').hidden = true; $('matchView').hidden = false; $('matchView').scrollTop = 0; renderMatch();
  clearInterval(tickId); tickId = setInterval(tick, 250);
  if (match.running || match.phase !== 'ready') wakeOn();
}
function closeMatch() {
  clearInterval(tickId); $('matchView').hidden = true; wakeOff(); stopAlarm();
  try { localStorage.removeItem('mini-prem-match-' + match.lid); } catch {}
  match = null;
}
function begin(phase) {
  unlockAudio();
  match.phase = phase; match.remMs = (phase === 'brk' ? match.breakMins || 2 : match.mins) * 60000; match.endAt = Date.now() + match.remMs; match.running = true;
  saveMatch(); wakeOn(); renderMatch();
}
$('lGo').onclick = () => {
  unlockAudio();
  const mins = Math.min(60, Math.max(1, +$('mins').value || 7));
  const breakMins = Math.min(15, Math.max(1, +$('brkMins').value || 2));
  try { localStorage.setItem('mini-prem-mins', mins); localStorage.setItem('mini-prem-brk', breakMins); } catch {}
  const soloP = lu.A.length === 1 ? lu.A[0] : lu.B[0];
  match = { lid: currentId, A: [...lu.A], B: [...lu.B], hs: state.handicap[soloP] || 0, goals: [], phase: 'ready', running: false, mins, breakMins, breakDone: false, remMs: mins * 60000, endAt: 0 };
  saveMatch(); openMatch();
};
$('mMain').onclick = () => {
  unlockAudio(); stopAlarm();
  const m = match;
  if (m.phase === 'ready') begin('h1');
  else if (m.phase === 'ht' || m.phase === 'brk') begin('h2');
  else if (m.phase === 'ft') {
    const dS = m.A.length === 2 ? 'A' : 'B', sS = dS === 'A' ? 'B' : 'A';
    // dg / sg are the final scores: they include the solo player's head start (hs), which no one "scored".
    const rec = { id: Date.now().toString(36), t: Date.now(), k: m[sS][0], dg: scoreOf(dS), sg: scoreOf(sS), hs: m.hs || 0,
      goals: m.goals.map(g => ({ s: g.s === dS ? 'd' : 's', p: g.p, m: g.m, h: g.h, ...(g.x ? { x: g.x } : {}) })) };
    state.matches.push(rec);
    remote(updateDoc(doc(leaguesCol, m.lid), { matches: arrayUnion(rec) }));
    closeMatch(); renderAll();
  } else if (m.running) { m.remMs = Math.max(0, m.endAt - Date.now()); m.running = false; saveMatch(); renderMatch(); }
  else { m.endAt = Date.now() + m.remMs; m.running = true; saveMatch(); renderMatch(); }
};
$('mBreak').onclick = () => { unlockAudio(); stopAlarm(); begin('brk'); };
// A goal for the solo player needs no question; for a pair we ask which of the two scored.
function goal(s) {
  const ps = match[s], at = nowMinute();                 // the minute is taken when +1 is tapped, not after the question
  if (ps.length === 1) { match.goals.push({ s, p: ps[0], ...at }); saveMatch(); renderMatch(); return; }
  const pl = state.players;
  $('sP0').innerHTML = av(pl, ps[0]) + `<span>${esc(pl[ps[0]])}</span>`;
  $('sP1').innerHTML = av(pl, ps[1]) + `<span>${esc(pl[ps[1]])}</span>`;
  $('sP0').onclick = () => pick(s, ps[0], at); $('sP1').onclick = () => pick(s, ps[1], at);
  $('scorer').hidden = false;
}
function pick(s, p, at) { $('scorer').hidden = true; match.goals.push({ s, p, ...at }); saveMatch(); renderMatch(); try { navigator.vibrate?.(30); } catch {} }
$('sCancel').onclick = () => { $('scorer').hidden = true; };
const undo = s => { const i = match.goals.map(g => g.s).lastIndexOf(s); if (i >= 0) { match.goals.splice(i, 1); saveMatch(); renderMatch(); } };
$('mHplus').onclick = () => goal('A'); $('mAplus').onclick = () => goal('B');
$('mHminus').onclick = () => undo('A'); $('mAminus').onclick = () => undo('B');
$('mCancel').onclick = () => { if (confirm('Cancel this match? The score is lost.')) closeMatch(); };

// ---- Live sync: everyone with the code sees the same leagues ----
async function start(code) {
  if (unsub) unsub();
  setStatus('Connecting…', 'warn');
  leaguesCol = collection(db, 'groups', await sha256(code), 'leagues');
  unsub = onSnapshot(leaguesCol, snap => {
    setStatus('Live', 'ok');
    const next = {};
    snap.forEach(d => {
      const v = d.data();
      next[d.id] = { name: v.name || 'League', players: Array.isArray(v.players) && v.players.length === 3 ? v.players : [...DEFAULT_PLAYERS],
        handicap: Array.isArray(v.handicap) && v.handicap.length === 3 ? v.handicap : [...DEFAULT_HANDICAP],
        matches: Array.isArray(v.matches) ? v.matches : [], createdAt: v.createdAt || 0 };
    });
    if (currentId && snap.metadata.hasPendingWrites && next[currentId]) next[currentId] = leagues[currentId] || next[currentId];  // our own edit, already shown
    leagues = next;
    if (!currentId) { const h = location.hash.slice(1); if (h && leagues[h]) currentId = h; }
    show();
  }, err => { console.error(err); setStatus('Offline', 'err'); });
}

const gate = $('gate'), codeInput = $('code');
function lock() {
  if (unsub) unsub(); unsub = null; leaguesCol = leagueRef = null; leagues = {}; currentId = null;
  history.replaceState(null, '', location.pathname); show();
  try { localStorage.removeItem(CODE_KEY); } catch {}
  gate.hidden = false; codeInput.value = ''; codeInput.focus();
}
$('gateForm').addEventListener('submit', e => {
  e.preventDefault();
  const code = codeInput.value.trim();
  if (code.length < 8) { $('gateErr').textContent = 'Code must be at least 8 characters.'; return; }
  $('gateErr').textContent = '';
  try { localStorage.setItem(CODE_KEY, code); } catch {}
  gate.hidden = true; start(code);
});
$('lock').onclick = lock;

let saved = null;
try { saved = localStorage.getItem(CODE_KEY); } catch {}
if (saved) { gate.hidden = true; start(saved); } else codeInput.focus();
</script>
</body>
</html>
